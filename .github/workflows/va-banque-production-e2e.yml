name: VA BANQUE E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/gra/va-banque/**"
      - "app/api/gra/va-banque/**"
      - "app/gry/va-banque/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "lib/platform-db*"
      - "components/active-game-rejoin-panel.tsx"
      - "components/live-game-guidance.tsx"
      - "scripts/va-banque-e2e.mjs"
      - ".github/workflows/va-banque-production-e2e.yml"

concurrency:
  group: va-banque-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  va-banque-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VA_BANQUE_PRIMARY_URL: https://zagraj.fun
      VA_BANQUE_FALLBACK_URL: https://platforma-gier.vercel.app
      VA_BANQUE_BASE_URL: http://127.0.0.1:3000
      CHECK_HOME: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Build PR app locally
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Start PR app locally
        if: github.event_name == 'pull_request'
        run: |
          nohup npm start -- -H 127.0.0.1 -p 3000 > /tmp/va-banque-pr.log 2>&1 &
          echo $! > /tmp/va-banque-pr.pid

      - name: Wait for local PR app
        if: github.event_name == 'pull_request'
        run: |
          for i in {1..60}; do
            HTML="$(curl -LfsS --max-time 10 "$VA_BANQUE_BASE_URL/gry/va-banque" || true)"
            if echo "$HTML" | grep -q "Rozstrzygnij remis"; then
              exit 0
            fi
            sleep 2
          done
          echo "Local VA BANQUE app did not become ready."
          cat /tmp/va-banque-pr.log || true
          exit 1

      - name: Select production target for manual regression
        if: github.event_name == 'workflow_dispatch'
        run: |
          PRIMARY_OK=0
          for i in {1..6}; do
            HTML="$(curl -LfsS --max-time 10 "$VA_BANQUE_PRIMARY_URL/gry/va-banque" || true)"
            if echo "$HTML" | grep -q "Rozstrzygnij remis"; then
              PRIMARY_OK=1
              break
            fi
            sleep 3
          done

          if [ "$PRIMARY_OK" -eq 1 ]; then
            echo "VA_BANQUE_BASE_URL=$VA_BANQUE_PRIMARY_URL" >> "$GITHUB_ENV"
          else
            echo "::warning title=zagraj.fun unavailable::Using the project's production Vercel alias for the manual VA BANQUE regression."
            echo "VA_BANQUE_BASE_URL=$VA_BANQUE_FALLBACK_URL" >> "$GITHUB_ENV"
          fi

      - name: Wait for manual production target
        if: github.event_name == 'workflow_dispatch'
        run: |
          for i in {1..60}; do
            HTML="$(curl -LfsS --max-time 20 "$VA_BANQUE_BASE_URL/gry/va-banque" || true)"
            if echo "$HTML" | grep -q "Rozstrzygnij remis"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run VA BANQUE browser E2E
        run: node scripts/va-banque-e2e.mjs

      - name: Show local app log on failure
        if: failure() && github.event_name == 'pull_request'
        run: cat /tmp/va-banque-pr.log || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-banque-e2e
          path: artifacts/va-banque
          if-no-files-found: ignore
