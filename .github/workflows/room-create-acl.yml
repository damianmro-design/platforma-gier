name: Room creation SQL permission test

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/staged-restrict-room-creation-to-server.sql'
      - 'supabase/tests/room-create-permissions-ci.sql'
      - '.github/workflows/room-create-acl.yml'

jobs:
  permission-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test SQL migration against synthetic roles and functions
        env:
          PGPASSWORD: ci-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/room-create-permissions-ci.sql
