name: AKTA NOCY Ostatni Kurs host E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/akta-nocy-ostatni-kurs-host-e2e.mjs"
      - ".github/workflows/akta-nocy-ostatni-kurs-host-e2e.yml"
      - "app/gry/akta-nocy/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "app/gra/akta-nocy/**"
      - "app/api/gra/akta-nocy-ostatni-kurs/**"
      - "lib/game-play-setup.ts"
      - "lib/akta-nocy-ostatni-kurs*"
      - "lib/platform-db*"
  push:
    branches: [main]
    paths:
      - "scripts/akta-nocy-ostatni-kurs-host-e2e.mjs"
      - ".github/workflows/akta-nocy-ostatni-kurs-host-e2e.yml"
      - "app/gry/akta-nocy/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "app/gra/akta-nocy/**"
      - "app/api/gra/akta-nocy-ostatni-kurs/**"
      - "lib/game-play-setup.ts"
      - "lib/akta-nocy-ostatni-kurs*"
      - "lib/platform-db*"

jobs:
  ostatni-kurs-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AKTA_PRIMARY_URL: https://zagraj.fun
      AKTA_FALLBACK_URL: https://platforma-gier.vercel.app
      AKTA_BASE_URL: https://zagraj.fun
      AKTA_EXPECT_FINAL_UX: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Give Vercel production time to publish push
        if: github.event_name == 'push'
        run: |
          sleep 75
          echo "AKTA_EXPECT_FINAL_UX=1" >> "$GITHUB_ENV"

      - name: Select reachable production target
        run: |
          PRIMARY_OK=0
          for i in {1..6}; do
            HTML="$(curl -LfsS --max-time 10 "$AKTA_PRIMARY_URL/gry/akta-nocy" || true)"
            if echo "$HTML" | grep -qi "Ostatni Kurs"; then
              PRIMARY_OK=1
              break
            fi
            sleep 3
          done
          if [ "$PRIMARY_OK" -eq 1 ]; then
            echo "AKTA_BASE_URL=$AKTA_PRIMARY_URL" >> "$GITHUB_ENV"
          else
            echo "::warning title=zagraj.fun unavailable::Custom production domain is unreachable. Running AKTA NOCY host regression against the production Vercel alias."
            echo "AKTA_BASE_URL=$AKTA_FALLBACK_URL" >> "$GITHUB_ENV"
          fi

      - name: Wait for selected production landing page
        run: |
          for i in {1..30}; do
            HTML="$(curl -LfsS --max-time 20 "$AKTA_BASE_URL/gry/akta-nocy" || true)"
            if echo "$HTML" | grep -qi "Ostatni Kurs"; then
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Verify final AKTA NOCY setup copy
        if: github.event_name == 'push'
        run: |
          HTML="$(curl -LfsS --max-time 20 "$AKTA_BASE_URL/gry/akta-nocy")"
          echo "$HTML" | grep -Fq "75–115 min, zależnie od sprawy"
          echo "$HTML" | grep -Fq "Apartament 214: wymagany. Ostatni Kurs: prowadzący albo tryb automatyczny"
          echo "$HTML" | grep -Fq "Telefon gracza pokazuje jego prywatne akta oraz wspólne materiały śledztwa."

      - name: Run Ostatni Kurs host E2E
        run: node scripts/akta-nocy-ostatni-kurs-host-e2e.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akta-nocy-ostatni-kurs-host-e2e
          path: artifacts/akta-nocy-ostatni-kurs-host
          if-no-files-found: ignore
