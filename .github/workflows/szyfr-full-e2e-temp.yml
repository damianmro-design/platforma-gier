name: Temporary full SZYFR E2E

on:
  push:
    branches: [fix-szyfr-hostless-restart-2026-10-05]

jobs:
  szyfr-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start zaGRAj locally
        run: |
          npm run dev > /tmp/zagraj-szyfr.log 2>&1 &
          echo $! > /tmp/zagraj-szyfr.pid
          for i in {1..90}; do
            if curl -fsS --max-time 10 http://localhost:3000/gry/szyfr >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zagraj-szyfr.log
          exit 1

      - name: Run full SZYFR E2E
        env:
          SZYFR_BASE_URL: http://localhost:3000
        run: node scripts/szyfr-e2e.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/zagraj-szyfr.log || true

      - name: Upload SZYFR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: szyfr-full-e2e
          path: artifacts/szyfr
          if-no-files-found: ignore
