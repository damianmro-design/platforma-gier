name: Pod Przykrywką E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/api/gra/pod-przykrywka/**"
      - "app/gra/pod-przykrywka/**"
      - "app/gry/pod-przykrywka/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "lib/platform-db*"
      - "components/active-game-rejoin-panel.tsx"
      - "scripts/pod-przykrywka-e2e.mjs"
      - ".github/workflows/pod-przykrywka-production-e2e.yml"

concurrency:
  group: pod-przykrywka-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pod-przykrywka-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PP_PRIMARY_URL: https://zagraj.fun
      PP_FALLBACK_URL: https://platforma-gier.vercel.app
      PP_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Build PR app locally
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Start PR app locally
        if: github.event_name == 'pull_request'
        run: |
          nohup npm start -- -H 127.0.0.1 -p 3000 > /tmp/pod-przykrywka-pr.log 2>&1 &
          echo $! > /tmp/pod-przykrywka-pr.pid

      - name: Wait for local PR app
        if: github.event_name == 'pull_request'
        run: |
          for i in {1..60}; do
            HTML="$(curl -LfsS --max-time 10 "$PP_BASE_URL/gry/pod-przykrywka" || true)"
            if echo "$HTML" | grep -Eqi "POD PRZYKRYWKĄ|POD PRZYKRYWKA"; then
              exit 0
            fi
            sleep 2
          done
          echo "Local Pod Przykrywką app did not become ready."
          cat /tmp/pod-przykrywka-pr.log || true
          exit 1

      - name: Select production target for manual regression
        if: github.event_name == 'workflow_dispatch'
        run: |
          PRIMARY_OK=0
          for i in {1..6}; do
            HTML="$(curl -LfsS --max-time 10 "$PP_PRIMARY_URL/gry/pod-przykrywka" || true)"
            if echo "$HTML" | grep -Eqi "POD PRZYKRYWKĄ|POD PRZYKRYWKA"; then
              PRIMARY_OK=1
              break
            fi
            sleep 3
          done
          if [ "$PRIMARY_OK" -eq 1 ]; then
            echo "PP_BASE_URL=$PP_PRIMARY_URL" >> "$GITHUB_ENV"
          else
            echo "::warning title=zagraj.fun unavailable::Using the production Vercel alias for the manual Pod Przykrywką regression."
            echo "PP_BASE_URL=$PP_FALLBACK_URL" >> "$GITHUB_ENV"
          fi

      - name: Wait for manual production target
        if: github.event_name == 'workflow_dispatch'
        run: |
          for i in {1..60}; do
            if curl -LfsS --max-time 20 -o /dev/null "$PP_BASE_URL/gry/pod-przykrywka"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run Pod Przykrywką browser E2E
        run: node scripts/pod-przykrywka-e2e.mjs

      - name: Show local app log on failure
        if: failure() && github.event_name == 'pull_request'
        run: cat /tmp/pod-przykrywka-pr.log || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pod-przykrywka-e2e
          path: artifacts/pod-przykrywka
          if-no-files-found: ignore
