name: Pod Przykrywką production E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/pod-przykrywka-e2e.mjs"
      - "scripts/pod-przykrywka-e2e-trigger.txt"
      - ".github/workflows/pod-przykrywka-production-e2e.yml"

jobs:
  pod-przykrywka-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PP_BASE_URL: https://zagraj.fun
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright driver and prepare runner Chrome
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on GitHub runner"
            exit 1
          fi
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/pod-przykrywka-e2e.mjs")
          text = path.read_text()
          old = '''  assert(hostAllAnswered.game.submissions.length === 6, "Prowadzący nie widzi wszystkich 6 odpowiedzi po zebraniu");
  assert(hostAllAnswered.game.currentPlayer === null, "Prowadzącemu ujawniono prywatny currentPlayer po odpowiedziach");
  check("all six answers submit and host sees submissions without role identity");

  let flow = hostAllAnswered;
'''
          new = '''  assert(hostAllAnswered.game.submissions.length === 0, "Treść odpowiedzi wyciekła prowadzącemu przed fazą ujawnienia");
  assert(hostAllAnswered.game.currentPlayer === null, "Prowadzącemu ujawniono prywatny currentPlayer po odpowiedziach");
  check("all six answers submit while their content stays hidden during mission");

  const revealTransition = await post(host, code, { action: "advance" });
  assert(revealTransition.status === 200, `Nie udało się ujawnić odpowiedzi: ${JSON.stringify(revealTransition.body)}`);
  let flow = await waitForState(host, code, game => game.phase !== "mission", "answer reveal phase");
  assert(flow.game.submissions.length === 6, "Po zakończeniu misji prowadzący nie widzi kompletu 6 odpowiedzi");
  check("all six submissions become visible only after mission closes");
'''
          if old not in text:
              raise SystemExit("Expected mission submissions block not found")
          text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Wait for production landing page
        run: |
          for i in {1..60}; do
            HTML="$(curl -LfsS --max-time 20 "$PP_BASE_URL/gry/pod-przykrywka" || true)"
            if echo "$HTML" | grep -q "POD" && echo "$HTML" | grep -q "PRZYKRYWKĄ"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run Pod Przykrywką production browser E2E
        run: node scripts/pod-przykrywka-e2e.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pod-przykrywka-production-e2e
          path: artifacts/pod-przykrywka
          if-no-files-found: ignore
