name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check beta preflight logic
        run: npm run test:beta

      - name: Test backup safeguards with synthetic data
        run: node --test scripts/tests/backup-supabase.test.mjs

      - name: Build
        run: npm run build
