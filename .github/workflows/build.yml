name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check beta preflight logic
        run: npm run test:beta

      - name: Test backup safeguards with synthetic data
        run: node --test scripts/tests/backup-*.test.mjs

      - name: Check server-only room creation rollout safety
        run: node --test scripts/tests/room-create-gateway.test.mjs

      - name: Build
        run: npm run build

      - name: Local HTTP request-size integration smoke
        run: |
          npm run start -- -p 3100 > /tmp/zagraj-local-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/tests/http-guard-smoke.mjs
