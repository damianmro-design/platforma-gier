name: Temporary SZYFR recovery E2E updater

on:
  push:
    branches: [fix-szyfr-hostless-restart-2026-10-05]

permissions:
  contents: write

jobs:
  update-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-szyfr-hostless-restart-2026-10-05
          fetch-depth: 0

      - name: Ignore only expected 401s during simulated lost session
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/szyfr-e2e.mjs')
          text = p.read_text()

          old = '''const browser = await chromium.launch({ headless: true });\nconst errors = [];\n\nfunction watch(page, label) {'''
          new = '''const browser = await chromium.launch({ headless: true });\nconst errors = [];\nlet expectedRecovery401 = false;\n\nfunction watch(page, label) {'''
          if old not in text:
              raise SystemExit('Missing errors/watch marker')
          text = text.replace(old, new, 1)

          old = '''      const text = message.text();\n      if (!text.includes("favicon") && !text.includes("qrserver")) {\n        const location = message.location();\n        errors.push(`${label} console: ${text} @ ${location.url || "unknown"}:${location.lineNumber || 0}`);\n      }'''
          new = '''      const text = message.text();\n      const location = message.location();\n      const expectedLostSessionError =\n        expectedRecovery401 &&\n        text.includes("401 (Unauthorized)") &&\n        location.url.includes("/api/gra/szyfr/");\n      if (!expectedLostSessionError && !text.includes("favicon") && !text.includes("qrserver")) {\n        errors.push(`${label} console: ${text} @ ${location.url || "unknown"}:${location.lineNumber || 0}`);\n      }'''
          if old not in text:
              raise SystemExit('Missing console watcher marker')
          text = text.replace(old, new, 1)

          old = '''  assert(playerCookie, "Agent player cookie missing before recovery test");\n  await agentContext.clearCookies({ name: playerCookie.name });'''
          new = '''  assert(playerCookie, "Agent player cookie missing before recovery test");\n  expectedRecovery401 = true;\n  await agentContext.clearCookies({ name: playerCookie.name });'''
          if old not in text:
              raise SystemExit('Missing first recovery marker')
          text = text.replace(old, new, 1)

          old = '''  await agent.waitForURL(new RegExp(`/gra/szyfr/${code}$`), { timeout: 10000 });\n\n  const restoredCookies = await agentContext.cookies();'''
          new = '''  await agent.waitForURL(new RegExp(`/gra/szyfr/${code}$`), { timeout: 10000 });\n  expectedRecovery401 = false;\n\n  const restoredCookies = await agentContext.cookies();'''
          if old not in text:
              raise SystemExit('Missing first restored marker')
          text = text.replace(old, new, 1)

          old = '''  assert(restoredPlayerCookie, "Player cookie missing after owner-approved rejoin");\n\n  await agentContext.clearCookies({ name: restoredPlayerCookie.name });'''
          new = '''  assert(restoredPlayerCookie, "Player cookie missing after owner-approved rejoin");\n\n  expectedRecovery401 = true;\n  await agentContext.clearCookies({ name: restoredPlayerCookie.name });'''
          if old not in text:
              raise SystemExit('Missing second recovery marker')
          text = text.replace(old, new, 1)

          old = '''  await agent.getByRole("button", { name: "Odzyskaj kodem" }).click();\n  await agent.waitForURL(new RegExp(`/gra/szyfr/${code}$`), { timeout: 10000 });\n\n  state = (await apiState(host, code)).body.game;'''
          new = '''  await agent.getByRole("button", { name: "Odzyskaj kodem" }).click();\n  await agent.waitForURL(new RegExp(`/gra/szyfr/${code}$`), { timeout: 10000 });\n  expectedRecovery401 = false;\n\n  state = (await apiState(host, code)).body.game;'''
          if old not in text:
              raise SystemExit('Missing second restored marker')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY

      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/szyfr-e2e.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Ignore expected SZYFR recovery 401s in E2E"
          git push origin HEAD:fix-szyfr-hostless-restart-2026-10-05
