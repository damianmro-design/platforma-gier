name: Temporary SZYFR hostless updater

on:
  push:
    branches: [fix-szyfr-hostless-restart-2026-10-05]

permissions:
  contents: write

jobs:
  update-code:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-szyfr-hostless-restart-2026-10-05
          fetch-depth: 0

      - name: Restore clean E2E and remove creator-only restart
        run: |
          git show 9e25eb9c0c7143986b5936cdfb66bd535b2e27ee:scripts/szyfr-e2e.mjs > scripts/szyfr-e2e.mjs
          python - <<'PY'
          from pathlib import Path

          db = Path('lib/szyfr-db.ts')
          text = db.read_text()
          replacements = [
              ('export async function retrySzyfr(code: string, hostToken: string) {\n  return Boolean(\n    await rpc("retry_szyfr", { p_code: code, p_host_token: hostToken }),\n  );\n}',
               'export async function retrySzyfr(code: string, accessToken: string) {\n  return Boolean(\n    await rpc("retry_szyfr", { p_code: code, p_host_token: accessToken }),\n  );\n}'),
              ('export async function rematchSzyfr(code: string, hostToken: string) {\n  return Boolean(\n    await rpc("rematch_szyfr", { p_code: code, p_host_token: hostToken }),\n  );\n}',
               'export async function rematchSzyfr(code: string, accessToken: string) {\n  return Boolean(\n    await rpc("rematch_szyfr", { p_code: code, p_host_token: accessToken }),\n  );\n}'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing szyfr-db marker: {old[:80]}')
              text = text.replace(old, new, 1)
          db.write_text(text)

          route = Path('app/api/gra/szyfr/[code]/route.ts')
          text = route.read_text()
          old = '''    if (action === "retry") {\n      if (!hostToken) return NextResponse.json({ error: "Tylko host może ponowić rozgrywkę." }, { status: 403 });\n      const ok = await retrySzyfr(code, hostToken);\n      if (!ok) return NextResponse.json({ error: "Ponowienie nie jest teraz dostępne." }, { status: 400 });\n      return NextResponse.json({ ok: true });\n    }\n\n    if (action === "rematch") {\n      if (!hostToken) return NextResponse.json({ error: "Tylko host może uruchomić nową misję." }, { status: 403 });\n      const ok = await rematchSzyfr(code, hostToken);\n      if (!ok) return NextResponse.json({ error: "Nowa misja nie jest teraz dostępna." }, { status: 400 });\n      return NextResponse.json({ ok: true });\n    }'''
          new = '''    if (action === "retry") {\n      const accessToken = playerToken ?? hostToken;\n      if (!accessToken) return NextResponse.json({ error: "Ta akcja wymaga uczestnika pokoju." }, { status: 403 });\n      const ok = await retrySzyfr(code, accessToken);\n      if (!ok) return NextResponse.json({ error: "Ponowienie nie jest teraz dostępne." }, { status: 400 });\n      return NextResponse.json({ ok: true });\n    }\n\n    if (action === "rematch") {\n      const accessToken = playerToken ?? hostToken;\n      if (!accessToken) return NextResponse.json({ error: "Ta akcja wymaga uczestnika pokoju." }, { status: 403 });\n      const ok = await rematchSzyfr(code, accessToken);\n      if (!ok) return NextResponse.json({ error: "Nowa misja nie jest teraz dostępna." }, { status: 400 });\n      return NextResponse.json({ ok: true });\n    }'''
          if old not in text:
              raise SystemExit('Missing SZYFR retry/rematch route block')
          route.write_text(text.replace(old, new, 1))

          client = Path('app/gra/szyfr/[code]/game-client.tsx')
          text = client.read_text()
          old = '''            {game.isHost ? (\n              <div className="mt-7 grid gap-3 sm:grid-cols-2">\n                <button\n                  type="button"\n                  disabled={busy}\n                  onClick={() => void send({ action: "retry" })}\n                  className="rounded-2xl border border-cyan-200/14 bg-cyan-200/[.06] px-5 py-4 text-sm font-black text-cyan-50 transition hover:bg-cyan-200/[.1] disabled:opacity-50"\n                >\n                  Spróbuj ponownie\n                </button>\n                <button\n                  type="button"\n                  disabled={busy}\n                  onClick={() => void send({ action: "rematch" })}\n                  className="rounded-2xl bg-gradient-to-r from-teal-300 via-cyan-300 to-sky-400 px-5 py-4 text-sm font-black text-[#032024] transition hover:brightness-110 disabled:opacity-50"\n                >\n                  Nowa misja\n                </button>\n              </div>\n            ) : (\n              <p className="mt-7 rounded-2xl border border-cyan-200/8 bg-black/20 p-4 text-xs font-bold text-cyan-50/45">\n                Osoba, która utworzyła pokój, może uruchomić ponowną próbę lub nowy zestaw misji.\n              </p>\n            )}'''
          new = '''            <div className="mt-7">\n              <p className="mb-3 text-xs font-bold text-cyan-50/45">\n                Dowolna osoba z zespołu może uruchomić kolejną próbę.\n              </p>\n              <div className="grid gap-3 sm:grid-cols-2">\n                <button\n                  type="button"\n                  disabled={busy}\n                  onClick={() => void send({ action: "retry" })}\n                  className="rounded-2xl border border-cyan-200/14 bg-cyan-200/[.06] px-5 py-4 text-sm font-black text-cyan-50 transition hover:bg-cyan-200/[.1] disabled:opacity-50"\n                >\n                  Spróbuj ponownie\n                </button>\n                <button\n                  type="button"\n                  disabled={busy}\n                  onClick={() => void send({ action: "rematch" })}\n                  className="rounded-2xl bg-gradient-to-r from-teal-300 via-cyan-300 to-sky-400 px-5 py-4 text-sm font-black text-[#032024] transition hover:brightness-110 disabled:opacity-50"\n                >\n                  Nowa misja\n                </button>\n              </div>\n            </div>'''
          if old not in text:
              raise SystemExit('Missing SZYFR finished controls block')
          client.write_text(text.replace(old, new, 1))

          e2e = Path('scripts/szyfr-e2e.mjs')
          text = e2e.read_text()
          old = '''  await agentContext.clearCookies({ name: playerCookie.name });\n  await agent.goto(`${baseURL}/pokoj/${code}`, { waitUntil: "domcontentloaded" });\n  await agent.getByText("ROZGRYWKA JUŻ TRWA").waitFor();\n  await agent.locator("#recoverName").fill("Agent 2");\n  await agent.locator("#recoverCode").fill(agentRecovery);\n  await agent.getByRole("button", { name: "Odzyskaj swoją postać" }).click();\n  await agent.waitForURL(new RegExp(`/gra/szyfr/${code}$`));'''
          new = '''  await agentContext.clearCookies({ name: playerCookie.name });\n  await agent.goto(`${baseURL}/pokoj/${code}`, { waitUntil: "domcontentloaded" });\n  await agent.getByText("ROZGRYWKA JUŻ TRWA").waitFor();\n  await agent.locator("#recoverName").selectOption({ label: "Agent 2" });\n  await agent.getByRole("button", { name: "Poproś o powrót" }).click();\n  await agent.getByText("Prośba wysłana do twórcy pokoju").waitFor();\n\n  await host.getByText("Gracz chce wrócić").waitFor({ timeout: 10000 });\n  await host.getByRole("button", { name: "WPUŚĆ Z POWROTEM" }).click();\n  await agent.waitForURL(new RegExp(`/gra/szyfr/${code}$`), { timeout: 10000 });\n\n  const restoredCookies = await agentContext.cookies();\n  const restoredPlayerCookie = restoredCookies.find((cookie) => cookie.name === `partyplay_player_${code}`);\n  assert(restoredPlayerCookie, "Player cookie missing after owner-approved rejoin");\n\n  await agentContext.clearCookies({ name: restoredPlayerCookie.name });\n  await agent.goto(`${baseURL}/pokoj/${code}`, { waitUntil: "domcontentloaded" });\n  await agent.getByText("ROZGRYWKA JUŻ TRWA").waitFor();\n  await agent.locator("#recoverName").selectOption({ label: "Agent 2" });\n  await agent.getByText("Mam kod powrotu").click();\n  await agent.locator("#recoverCode").fill(agentRecovery);\n  await agent.getByRole("button", { name: "Odzyskaj kodem" }).click();\n  await agent.waitForURL(new RegExp(`/gra/szyfr/${code}$`), { timeout: 10000 });'''
          if old not in text:
              raise SystemExit('Missing clean recovery block in restored SZYFR E2E')
          text = text.replace(old, new, 1)

          old = '''  const oldSignature = finished.scenarioSignature;\n  await host.getByRole("button", { name: "Nowa misja" }).click();\n  const rematch = await waitForGameState(host, code, (g) => g.phase === "tutorial", "rematch tutorial");\n  assert(rematch.scenarioSignature !== oldSignature, "New mission repeated the exact same scenario signature");'''
          new = '''  const oldSignature = finished.scenarioSignature;\n  await host.close();\n  await agent.getByRole("button", { name: "Nowa misja" }).click();\n  const rematch = await waitForGameState(agent, code, (g) => g.phase === "tutorial", "player-started rematch tutorial");\n  assert(rematch.scenarioSignature !== oldSignature, "New mission repeated the exact same scenario signature");'''
          if old not in text:
              raise SystemExit('Missing clean rematch block in restored SZYFR E2E')
          text = text.replace(old, new, 1)

          text = text.replace('        "recovery after lost cookie",', '        "owner-approved rejoin after lost cookie",\n        "recovery-code fallback after lost cookie",', 1)
          text = text.replace('        "new scenario rematch",', '        "player-started new scenario rematch after creator disconnect",', 1)
          e2e.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/szyfr-db.ts 'app/api/gra/szyfr/[code]/route.ts' 'app/gra/szyfr/[code]/game-client.tsx' scripts/szyfr-e2e.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Make SZYFR restart truly hostless and repair E2E"
          git push origin HEAD:fix-szyfr-hostless-restart-2026-10-05
