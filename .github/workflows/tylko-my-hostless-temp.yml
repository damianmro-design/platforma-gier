name: Temporary TYLKO MY hostless updater

on:
  push:
    branches: [fix-tylko-my-hostless-advance-2026-10-05]

permissions:
  contents: write

jobs:
  update-code:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-tylko-my-hostless-advance-2026-10-05
          fetch-depth: 0

      - name: Remove creator-device dependency
        run: |
          python - <<'PY'
          from pathlib import Path

          db = Path('lib/tylko-my-db.ts')
          text = db.read_text()
          old = '''export async function advanceTmQuestion(\n  code: string,\n  hostToken: string,\n  expectedQuestionIndex: number,\n  scoreDelta: number,\n  totalQuestions: number,\n) {\n  const supabase = getClient();\n  const { data, error } = await supabase.rpc("advance_tm_question", {\n    p_code: code,\n    p_host_token: hostToken,'''
          new = '''export async function advanceTmQuestion(\n  code: string,\n  accessToken: string,\n  expectedQuestionIndex: number,\n  scoreDelta: number,\n  totalQuestions: number,\n) {\n  const supabase = getClient();\n  const { data, error } = await supabase.rpc("advance_tm_question", {\n    p_code: code,\n    p_host_token: accessToken,'''
          if old not in text:
              raise SystemExit('Missing advanceTmQuestion marker')
          db.write_text(text.replace(old, new, 1))

          route = Path('app/api/gra/tylko-my/[code]/route.ts')
          text = route.read_text()
          replacements = [
              ('if (raw.includes("Host access required")) return "Tylko osoba, która utworzyła pokój, może przejść dalej.";',
               'if (raw.includes("Host access required")) return "Nie masz dostępu do tej rozgrywki.";'),
              ('canAdvance: Boolean(rawHostToken && testView !== "player"),',
               'canAdvance: true,'),
              ('''    if (action === "next") {\n      if (!hostToken) {\n        return NextResponse.json(\n          { error: "Tylko osoba, która utworzyła pokój, może przejść dalej." },\n          { status: 403 },\n        );\n      }\n\n      const state = await getTmState(code, null, hostToken);''',
               '''    if (action === "next") {\n      const advanceToken = playerToken ?? hostToken;\n      if (!advanceToken) {\n        return NextResponse.json(\n          { error: "Nie masz dostępu do tej rozgrywki." },\n          { status: 403 },\n        );\n      }\n\n      const state = await getTmState(code, playerToken, hostToken);'''),
              ('        hostToken,\n        state.question_index,',
               '        advanceToken,\n        state.question_index,'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing route marker: {old[:80]}')
              text = text.replace(old, new, 1)
          route.write_text(text)
          PY

      - name: Commit code change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tylko-my-db.ts 'app/api/gra/tylko-my/[code]/route.ts'
          git diff --cached --quiet && exit 0
          git commit -m "Make TYLKO MY auto-advance hostless"
          git push origin HEAD:fix-tylko-my-hostless-advance-2026-10-05
