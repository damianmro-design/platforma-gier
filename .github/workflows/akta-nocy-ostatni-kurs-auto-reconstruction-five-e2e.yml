name: AKTA NOCY Ostatni Kurs auto reconstruction 5/5 E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/akta-nocy-ostatni-kurs-auto-evidence-step-e2e.mjs"
      - ".github/workflows/akta-nocy-ostatni-kurs-auto-reconstruction-five-e2e.yml"
      - "app/gra/akta-nocy/**"
      - "app/api/gra/akta-nocy-ostatni-kurs/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "lib/akta-nocy-ostatni-kurs*"
      - "lib/platform-db*"
  push:
    branches: [main]
    paths:
      - "app/gra/akta-nocy/**"
      - "app/api/gra/akta-nocy-ostatni-kurs/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "lib/akta-nocy-ostatni-kurs*"
      - "lib/platform-db*"
      - "scripts/akta-nocy-ostatni-kurs-auto-evidence-step-e2e.mjs"
      - ".github/workflows/akta-nocy-ostatni-kurs-auto-reconstruction-five-e2e.yml"

jobs:
  ostatni-kurs-auto-reconstruction-five:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AKTA_PRIMARY_URL: https://zagraj.fun
      AKTA_FALLBACK_URL: https://platforma-gier.vercel.app
      AKTA_BASE_URL: https://zagraj.fun
      OK_CURRENT_PHASE: ok_nowy_trop
      OK_NEXT_PHASE: ok_rekonstrukcja
      OK_NEXT_EVIDENCE_ID: platform-return
      OK_NEXT_EVIDENCE_TITLE: Drugi kąt kamery peronowej
      OK_NEXT_UI_TEXT: 07 · TWOJA REKONSTRUKCJA
      OK_CURRENT_EVIDENCE_COUNT: 11
      OK_NEXT_EVIDENCE_COUNT: 11
      OK_SUBMIT_ALL_RECONSTRUCTIONS: 1
      OK_ARTIFACT_SLUG: akta-nocy-ostatni-kurs-auto-reconstruction-five

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Give Vercel production time to publish push
        if: github.event_name == 'push'
        run: sleep 75
      - name: Select reachable production target
        run: |
          PRIMARY_OK=0
          for i in {1..6}; do
            HTML="$(curl -LfsS --max-time 10 "$AKTA_PRIMARY_URL/gry/akta-nocy" || true)"
            if echo "$HTML" | grep -qi "Ostatni Kurs"; then
              PRIMARY_OK=1
              break
            fi
            sleep 3
          done
          if [ "$PRIMARY_OK" -eq 1 ]; then
            echo "AKTA_BASE_URL=$AKTA_PRIMARY_URL" >> "$GITHUB_ENV"
          else
            echo "::warning title=zagraj.fun unavailable::Custom production domain is unreachable. Running Ostatni Kurs regression against the production Vercel alias. Check DNS configuration for zagraj.fun."
            echo "AKTA_BASE_URL=$AKTA_FALLBACK_URL" >> "$GITHUB_ENV"
          fi
      - name: Wait for selected production landing page
        run: |
          for i in {1..30}; do
            HTML="$(curl -LfsS --max-time 20 "$AKTA_BASE_URL/gry/akta-nocy" || true)"
            if echo "$HTML" | grep -qi "Ostatni Kurs"; then
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Run Ostatni Kurs reconstruction 5/5 E2E
        run: node scripts/akta-nocy-ostatni-kurs-auto-evidence-step-e2e.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akta-nocy-ostatni-kurs-auto-reconstruction-five-e2e
          path: artifacts/akta-nocy-ostatni-kurs-auto-reconstruction-five
          if-no-files-found: ignore
