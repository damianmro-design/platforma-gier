name: TYLKO MY production E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  pull_request:
    branches: [main]
    paths:
      - "scripts/tylko-my-e2e.mjs"
      - ".github/workflows/tylko-my-production-e2e.yml"
  push:
    branches: [main]
    paths:
      - "app/gra/tylko-my/**"
      - "app/api/gra/tylko-my/**"
      - "app/gry/tylko-my/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "lib/tylko-my*"
      - "lib/platform-db*"
      - "components/live-game-guidance.tsx"
      - "scripts/tylko-my-e2e.mjs"
      - ".github/workflows/tylko-my-production-e2e.yml"

jobs:
  tylko-my-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TYLKO_MY_BASE_URL: https://zagraj.fun
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright driver and prepare runner Chrome
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on GitHub runner"
            exit 1
          fi
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/tylko-my-e2e.mjs")
          text = path.read_text()

          text = text.replace(
              'const browser = await chromium.launch({ headless: true });',
              'const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_BIN });',
          )
          text = text.replace(
              'await page.getByRole("button", { name: option.label, exact: true }).click();',
              'await page.getByText(option.label, { exact: true }).click();',
          )
          text = text.replace(
              '  await page.getByText("Odpowiedź zatwierdzona", { exact: false }).waitFor({ state: "visible" });\n',
              '',
          )
          old = '''  const creatorWaiting = await apiState(creator, code);\n  assert(creatorWaiting.status === 200, "Nie udało się odczytać stanu po pierwszej odpowiedzi");\n  assert(creatorWaiting.body.game.answerCount === 1, "Pierwsza odpowiedź nie została zapisana jako prywatna");\n  assert(creatorWaiting.body.game.revealed === false, "Odpowiedź została odsłonięta przed ruchem drugiej osoby");\n'''
          new = '''  const creatorWaiting = await waitForGameState(\n    creator,\n    code,\n    (game) => game.questionIndex === 0 && game.answerCount === 1 && game.revealed === false,\n    "first private answer persistence",\n    10000,\n  );\n  assert(creatorWaiting.answerCount === 1, "Pierwsza odpowiedź nie została zapisana jako prywatna");\n  assert(creatorWaiting.revealed === false, "Odpowiedź została odsłonięta przed ruchem drugiej osoby");\n'''
          if old not in text:
              raise SystemExit("Expected private-answer assertion block not found")
          text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Give Vercel production time to publish push
        if: github.event_name == 'push'
        run: sleep 75

      - name: Wait for production landing page
        run: |
          for i in {1..60}; do
            HTML="$(curl -LfsS --max-time 20 "$TYLKO_MY_BASE_URL/gry/tylko-my" || true)"
            if echo "$HTML" | grep -q "Odpowiadajcie osobno"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run TYLKO MY production browser E2E
        run: node scripts/tylko-my-e2e.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tylko-my-production-e2e
          path: artifacts/tylko-my
          if-no-files-found: ignore
