name: AKTA NOCY canonical mechanics E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/akta-nocy-apartament-reveal-entry-e2e.mjs"
      - "scripts/akta-nocy-ostatni-kurs-auto-close-e2e.mjs"
      - ".github/workflows/akta-nocy-canonical-mechanics-e2e.yml"
      - "app/gra/akta-nocy/**"
      - "app/api/gra/akta-nocy/**"
      - "app/api/gra/akta-nocy-ostatni-kurs/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "lib/akta-nocy*"
      - "lib/platform-db*"

concurrency:
  group: akta-nocy-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AKTA_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Build app locally
        run: npm run build

      - name: Start local app
        run: |
          nohup npm start -- -H 127.0.0.1 -p 3000 > /tmp/akta-canonical.log 2>&1 &
          echo $! > /tmp/akta-canonical.pid

      - name: Wait for local app
        run: |
          for i in {1..60}; do
            HTML="$(curl -LfsS --max-time 10 "$AKTA_BASE_URL/gry/akta-nocy" || true)"
            if echo "$HTML" | grep -Eqi "Ostatni Kurs|Apartament 214"; then
              exit 0
            fi
            sleep 2
          done
          echo "Local app did not become ready."
          cat /tmp/akta-canonical.log || true
          exit 1

      - name: Run Apartament 214 canonical regression
        run: node scripts/akta-nocy-apartament-reveal-entry-e2e.mjs

      - name: Run Ostatni Kurs canonical regression
        run: node scripts/akta-nocy-ostatni-kurs-auto-close-e2e.mjs

      - name: Show local app log on failure
        if: failure()
        run: cat /tmp/akta-canonical.log || true

      - name: Upload canonical regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akta-nocy-canonical-mechanics-e2e
          path: |
            artifacts/akta-nocy-apartament-reveal-entry
            artifacts/akta-nocy-ostatni-kurs-auto-close
          if-no-files-found: ignore
