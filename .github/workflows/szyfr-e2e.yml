name: SZYFR browser E2E

on:
  pull_request:
    branches: [main]

jobs:
  szyfr-e2e:
    if: github.head_ref == 'feat/szyfr-release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SZYFR_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/szyfr-next.log 2>&1 &
          echo $! > /tmp/szyfr-next.pid
          for i in {1..60}; do
            if curl -fsS --max-time 10 http://127.0.0.1:3000/gry/szyfr >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/szyfr-next.log
          exit 1

      - name: Run SZYFR browser E2E
        run: node scripts/szyfr-e2e.mjs

      - name: Server log
        if: failure()
        run: cat /tmp/szyfr-next.log || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: szyfr-e2e
          path: artifacts/szyfr
          if-no-files-found: ignore
