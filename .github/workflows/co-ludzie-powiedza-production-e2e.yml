name: CO LUDZIE POWIEDZĄ E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/api/gra/co-ludzie-powiedza/**"
      - "app/gra/co-ludzie-powiedza/**"
      - "app/gry/co-ludzie-powiedza/**"
      - "app/pokoj/**"
      - "app/api/pokoj/**"
      - "lib/platform-db*"
      - "components/active-game-rejoin-panel.tsx"
      - "scripts/co-ludzie-powiedza-e2e.mjs"
      - ".github/workflows/co-ludzie-powiedza-production-e2e.yml"

concurrency:
  group: co-ludzie-powiedza-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  co-ludzie-powiedza-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLP_PRIMARY_URL: https://zagraj.fun
      CLP_FALLBACK_URL: https://platforma-gier.vercel.app
      CLP_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Build PR app locally
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Start PR app locally
        if: github.event_name == 'pull_request'
        run: |
          nohup npm start -- -H 127.0.0.1 -p 3000 > /tmp/clp-pr.log 2>&1 &
          echo $! > /tmp/clp-pr.pid

      - name: Wait for local PR app
        if: github.event_name == 'pull_request'
        run: |
          for i in {1..60}; do
            HTML="$(curl -LfsS --max-time 10 "$CLP_BASE_URL/gry/co-ludzie-powiedza" || true)"
            if echo "$HTML" | grep -Eqi "CO LUDZIE|POWIEDZĄ"; then
              exit 0
            fi
            sleep 2
          done
          echo "Local CO LUDZIE POWIEDZĄ app did not become ready."
          cat /tmp/clp-pr.log || true
          exit 1

      - name: Select production target for manual regression
        if: github.event_name == 'workflow_dispatch'
        run: |
          PRIMARY_OK=0
          for i in {1..6}; do
            HTML="$(curl -LfsS --max-time 10 "$CLP_PRIMARY_URL/gry/co-ludzie-powiedza" || true)"
            if echo "$HTML" | grep -Eqi "CO LUDZIE|POWIEDZĄ"; then
              PRIMARY_OK=1
              break
            fi
            sleep 3
          done
          if [ "$PRIMARY_OK" -eq 1 ]; then
            echo "CLP_BASE_URL=$CLP_PRIMARY_URL" >> "$GITHUB_ENV"
          else
            echo "::warning title=zagraj.fun unavailable::Using the production Vercel alias for the manual CO LUDZIE POWIEDZĄ regression."
            echo "CLP_BASE_URL=$CLP_FALLBACK_URL" >> "$GITHUB_ENV"
          fi

      - name: Wait for manual production target
        if: github.event_name == 'workflow_dispatch'
        run: |
          for i in {1..60}; do
            if curl -LfsS --max-time 20 -o /dev/null "$CLP_BASE_URL/gry/co-ludzie-powiedza"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run CO LUDZIE POWIEDZĄ browser E2E
        run: node scripts/co-ludzie-powiedza-e2e.mjs

      - name: Show local app log on failure
        if: failure() && github.event_name == 'pull_request'
        run: cat /tmp/clp-pr.log || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-ludzie-powiedza-e2e
          path: artifacts/co-ludzie-powiedza
          if-no-files-found: ignore
